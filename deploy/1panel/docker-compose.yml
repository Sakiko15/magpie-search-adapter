# Paste this file into 1Panel: 容器 -> 编排 -> 创建编排 -> 编辑.
# Nothing here needs editing: put a .env file in the same directory (copy
# .env.example from the repo). 1Panel's OpenResty proxies to 127.0.0.1:8787,
# so never open that port in the firewall.
services:
  magpie-search-adapter:
    image: ghcr.io/sakiko15/magpie-search-adapter:latest
    container_name: magpie-search-adapter
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8787:8787"
