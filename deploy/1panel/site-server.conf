# 1Panel: 网站 -> <your site> -> 配置修改 (the site's main server block).
# Replace every occurrence of search.example.com with your own domain
# (6 places: server_name, error_log, ssl_certificate, ssl_certificate_key,
# root and the include at the bottom).
#
# The reverse-proxy location block is a separate file:
# deploy/1panel/reverse-proxy.conf (site -> reverse proxy -> config file).
# Keep the `include .../proxy/*.conf;` line, or the location block is ignored.

server {
    listen 80;
    listen 443 ssl;
    server_name search.example.com;

    index index.php index.html index.htm default.php default.htm default.html;
    # The adapter accepts ?key= for SearXNG/Google clients; 1Panel's `main`
    # format logs $request including the query string, which leaks keys.
    # To keep access logs, define a query-free log_format in OpenResty's
    # http{} block (log $uri, not $request) and reference it here.
    access_log off;
    error_log /www/sites/search.example.com/log/error.log;

    # Some API clients send headers with underscores (e.g. session_id).
    underscores_in_headers on;
    ignore_invalid_headers off;

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # `http2 on;` needs nginx >= 1.25.1 / OpenResty >= 1.25.3.1. On older
    # 1Panel builds, delete this line.
    http2 on;

    # 308 keeps the method and body; a 301 turns POST into GET.
    if ($scheme = http) {
        return 308 https://$host$request_uri;
    }
    error_page 497 =308 https://$host$request_uri;

    ssl_certificate /www/sites/search.example.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/search.example.com/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /www/sites/search.example.com/index;
    include /www/sites/search.example.com/proxy/*.conf;
}
