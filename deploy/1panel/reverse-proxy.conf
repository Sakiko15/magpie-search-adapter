# 1Panel: 网站 -> <your site> -> 反向代理 -> 配置文件.
# Replace the whole file (usually /www/sites/<domain>/proxy/root.conf).
# Select all existing content first (Ctrl+A, Delete): the file must contain
# exactly ONE location block. Leftover generated lines such as
# proxy_connect_timeout / proxy_send_timeout / proxy_read_timeout cause
# `"proxy_connect_timeout" directive is duplicate` on save.
# The site's main config pulls it in with `include .../proxy/*.conf;`
# (see deploy/1panel/site-server.conf).
#
# This adapter is a plain JSON API: no SSE, no WebSocket, no streaming, so
# unlike new-api there is no Upgrade/Connection passthrough and nginx
# buffering stays on (safer for slow clients).

# Plain prefix (no ^~) so the site's hidden-file regex (return 404) applies.
location / {
    proxy_pass http://127.0.0.1:8787;

    proxy_http_version 1.1;
    # Keep the hop-by-hop Connection header out of the upstream request.
    proxy_set_header Connection "";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # /extract can run 3x FETCH_TIMEOUT (270s by default), and SEARCH_BUDGET
    # may be raised to 2-3x REQUEST_TIMEOUT. The adapter's own write timeout
    # is the largest of those plus 30s (300s with defaults); keep nginx above
    # it.
    proxy_connect_timeout 30s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # MAX_BODY_BYTES defaults to 1 MiB; 2m leaves headroom.
    client_max_body_size 2m;
    client_body_buffer_size 1m;

    # Every adapter response carries Cache-Control: no-store.
    proxy_cache off;
    tcp_nodelay on;

    # A client abort closes nginx's upstream connection. A shared search may
    # still run to SEARCH_BUDGET (see resilience), so abandoned slow searches
    # keep their concurrency slot and Magpie quota until the budget ends.
    proxy_ignore_client_abort off;
}

# Optional: an upstream keepalive pool. `upstream` is only valid in the
# http {} block (1Panel -> OpenResty global config), never inside a site's
# server block. After adding it, change proxy_pass above to
#   proxy_pass http://magpie_search_adapter;
# For a localhost upstream the gain is small; skip it unless you need it.
#
# upstream magpie_search_adapter {
#     keepalive 32;
#     keepalive_timeout 60s;
#     server 127.0.0.1:8787;
# }
