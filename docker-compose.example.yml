services:
  magpie-search-adapter:
    build:
      context: .
      dockerfile: Dockerfile
    image: magpie-search-adapter:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LISTEN_ADDR: 0.0.0.0:8787
    # Bind to loopback only: 1Panel's OpenResty proxies to it. Never open 8787
    # in the firewall.
    ports:
      - "127.0.0.1:8787:8787"
    # Magpie is in Docker too, so host.docker.internal is not needed by default.
    # Uncomment when Magpie runs on the host and MAGPIE_BASE_URL uses
    # host.docker.internal:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
