name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    # README, compose files, .env.example and CI config never end up in the
    # image; skip those builds.
    paths-ignore:
      - "**/*.md"
      - "deploy/**"
      - ".env.example"
      - "docker-compose*.yml"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR requires a lowercase image name; github.repository keeps the
          # account's capitals (Sakiko15).
          images: ghcr.io/sakiko15/magpie-search-adapter
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Keep the manifest free of attestation manifests; older Docker
          # versions on some 1Panel servers stumble over them.
          provenance: false
